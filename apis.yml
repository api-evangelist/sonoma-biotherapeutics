description: 'Sonoma Biotherapeutics is a clinical-stage biopharmaceutical company developing engineered
  regulatory T cell (Treg) therapies to restore immune balance in autoimmune and inflammatory diseases.
  Building on Nobel Prize-winning Treg biology, its lead program SBT-77-7101 is in Phase 1 clinical trials
  for conditions including refractory rheumatoid arthritis and hidradenitis suppurativa. Backed by 8VC and
  GV, the company operates in cell therapy and does not publish a public developer API surface. Sector: biotech.'
